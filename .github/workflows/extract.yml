name: Extract zip

on:
  push:
    paths:
      - 'inventory-railway.zip'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract
        run: |
          if [ ! -f inventory-railway.zip ]; then
            echo "Zip tidak ada, skip"
            exit 0
          fi
          unzip -q inventory-railway.zip -d /tmp/out
          cp -a /tmp/out/inventory/. .
          rm inventory-railway.zip

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Extract inventory-railway.zip"
          git push
